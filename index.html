<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>The Cake Lab — Menu</title>
  <style>
    :root {

      --cream-2: #f5ebd8;

    * { box-sizing: border-box; }

    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .page { max-width: 1800px; margin: 0 auto; padding: 24px 32px 60px; }
    .cover-wrap { position: relative; margin-bottom: 20px; }

  <script>
    const SHEET_ID = '1zerCC76frlLkwu9SysaAix3_Tm1FfWcgQIpvmO7Gsus';
    const SHEET_GID = '1138415008';
    const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;
    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else { field += c; }
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field); field = '';
        } else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field); field = '';
          rows.push(row); row = [];
        } else {
          field += c;
        }
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows;
    }
    const IMG_CACHE_BUST = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    function normalizeDriveImg(raw) {
      const url = (raw || '').trim();
      if (!url) return '';
      const fileViewMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileViewMatch) return `https://drive.google.com/thumbnail?id=${fileViewMatch[1]}&sz=w800&v=${IMG_CACHE_BUST}`;
      const openMatch = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
      if (openMatch) return `https://drive.google.com/thumbnail?id=${openMatch[1]}&sz=w800&v=${IMG_CACHE_BUST}`;
      const thumbMatch = url.match(/drive\.google\.com\/thumbnail\?id=([a-zA-Z0-9_-]+)/);
      if (thumbMatch) return `https://drive.google.com/thumbnail?id=${thumbMatch[1]}&sz=w800&v=${IMG_CACHE_BUST}`;
      if (/^https?:\/\//.test(url)) return url;
      return '';
    }
    function rowsToProducts(rows) {
      return rows.slice(1).filter(r => (r[0] || '').trim()).map(r => {
        const cs1 = (r[13] || '').trim().toUpperCase() === 'TRUE';
        const cs2 = (r[14] || '').trim().toUpperCase() === 'TRUE';
        const cs4 = (r[15] || '').trim().toUpperCase() === 'TRUE';

      document.getElementById('modalMeta').innerHTML = `${isBestSeller(product) ? '<span class="badge bestseller-badge">⭐ Best Seller</span>' : ''}<span class="tag">${product.dvt || ''}</span><span class="tag">${product.loai || ''}</span><span class="tag">${product.nhom || ''}</span>`;
      document.getElementById('modalDesc').textContent = product.mo_ta || 'Không có mô tả thành phần.';
      const availableStores = STORE_LIST.filter(store => product.stores?.[store.id]?.pickup);
      const storesEl = document.getElementById('modalStores');
      if (!product.visibility?.pickup) {
        storesEl.innerHTML = '';
      } else if (availableStores.length) {
        storesEl.innerHTML = `<span class="modal-stores-title">Đang có sẵn tại:</span><div class="store-tags">${availableStores.map(store => `<span class="store-tag">${store.label}</span>`).join('')}</div>`;
      } else {
        storesEl.innerHTML = `<span class="modal-stores-title">Đang có sẵn tại:</span><div class="store-tags"><span class="store-tag unavailable">Hiện chưa có sẵn tại cửa hàng nào</span></div>`;
      }
      modal.hidden = false;
    }
    function closeProductModal() {
      document.getElementById('productModal').hidden = true;
    }
    async function loadProductsFromSheet() {
      const container = document.getElementById('menuContent');
      container.innerHTML = '<div class="empty-state">Đang tải danh sách sản phẩm...</div>';
      try {
        const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
        const text = await res.text();
        PRODUCTS_CACHE = rowsToProducts(parseCsv(text)).concat(CUSTOM_CAKES);
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Không tải được danh sách sản phẩm. Vui lòng tải lại trang.</div>';
        return;
      }
      renderCategories();
      renderStoreSelect();
      renderMenu();
    }
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        currentTab = button.dataset.tab;
        currentStore = null;
        renderStoreSelect();
        renderMenu();
      }));
      document.getElementById('searchInput').addEventListener('input', renderMenu);
      document.getElementById('menuContent').addEventListener('click', event => {
        const messengerBtn = event.target.closest('.messenger-btn');
        if (messengerBtn) {
          const product = PRODUCTS_CACHE.find(item => item.ma === messengerBtn.dataset.productId);
          if (product) openMessenger(product);
          return;
        }
        const card = event.target.closest('.product-card');
        if (!card) return;
        const product = PRODUCTS_CACHE.find(item => item.ma === card.dataset.productId);
        if (product) openProductModal(product);
      });
      document.getElementById('modalMessengerBtn').addEventListener('click', () => {
        if (modalProduct) openMessenger(modalProduct);
      });
      document.getElementById('modalClose').addEventListener('click', closeProductModal);
      document.getElementById('productModal').addEventListener('click', event => {
        if (event.target.id === 'productModal') closeProductModal();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeProductModal();
      });
      loadProductsFromSheet();
    });
  </script>
</body>
</html>
